[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-iaq-semcom"
version = "0.1.0"
description = "Native RGB semantic communication experiments with soft decoding and evidence-conditioned repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision",
  "timm>=1.0",
  "numpy",
  "scipy",
  "pyyaml",
  "huggingface-hub",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
semcom = "vit_iaq_semcom.framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: 需要联网（下载 HF 权重/数据集）；离线时跳过",
]
